dataset: tinyimagenet
num_tasks: 10
classes_per_task: 20
seeds: [42, 43, 44]
architecture: resnet18
stem: torchvision_7x7_stride2_maxpool
feature_dim: 512
pretrained: false
batch_size: 128
num_workers: 2
epochs_per_task: 100
learning_rate: 0.1
momentum: 0.9
weight_decay: 0.0001
lr_scheduler: cosine_per_successful_update
gradient_clip_max_norm: 1.0
mixed_precision: true
freeze_old_classifier: false
lwf_temperature: 2.0
lwf_alpha: 1.0
centroid_weight: 1.0
centroid_loss_mode: raw
lambda_angle: 1.0
buffer_size: 200
anchor_samples_per_class: 200
anchor_batch_size: 128
anchor_every_n_steps: 4
etf_warmup_epochs: 0
freeze_bn_during_anchor: true
anchor_all_seen_tasks: false
diagnostic_every_epochs: 5
eval_batch_size: 128
deterministic: true
deterministic_algorithms_warn_only: true
allow_tf32: false
torch_cpu_threads: 2
augmentation:
  random_crop_size: 64
  padding: 8
  horizontal_flip_probability: 0.5
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
checkpoint_keep_epochs: 2
smoke:
  num_tasks: 2
  classes_per_task: 2
  epochs_per_task: 2
  train_per_class: 8
  val_per_class: 4
  buffer_size: 4
  batch_size: 4
  anchor_batch_size: 4
  diagnostic_every_epochs: 1
  num_workers: 0
